<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AMB Recoup{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    {% if user %}
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">AMB Recoup</div>
            <nav>
                <a href="/dashboard" class="nav-link {% if request.url.path.startswith('/dashboard') %}active{% endif %}">
                    <span>📊</span> Dashboard
                </a>
                <a href="/clients" class="nav-link {% if request.url.path.startswith('/clients') %}active{% endif %}">
                    <span>👤</span> Clients
                </a>
                <a href="/projects" class="nav-link {% if request.url.path.startswith('/projects') %}active{% endif %}">
                    <span>📁</span> Projects
                </a>
                <a href="/time" class="nav-link {% if request.url.path.startswith('/time') %}active{% endif %}">
                    <span>⏱️</span> Time
                </a>
                <a href="/mileage" class="nav-link {% if request.url.path.startswith('/mileage') %}active{% endif %}">
                    <span>🚗</span> Mileage
                </a>
                <a href="/expenses" class="nav-link {% if request.url.path.startswith('/expenses') %}active{% endif %}">
                    <span>💳</span> Expenses
                </a>
                <a href="/reports" class="nav-link {% if request.url.path.startswith('/reports') %}active{% endif %}">
                    <span>📥</span> Export CSV
                </a>
                <a href="/settings" class="nav-link {% if request.url.path.startswith('/settings') %}active{% endif %}">
                    <span>⚙️</span> Settings
                </a>
                {% if user.is_superuser %}
                <a href="/admin" class="nav-link {% if request.url.path.startswith('/admin') %}active{% endif %}">
                    <span>🔧</span> Admin
                </a>
                {% endif %}
            </nav>
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--color-border);">
                <div style="font-size: 0.75rem; color: var(--color-text-muted);">
                    {{ user.email }}
                </div>
                <a href="/auth/logout" class="nav-link" style="margin-top: 0.5rem;">
                    <span>🚪</span> Log out
                </a>
            </div>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% else %}
    {% block auth_content %}{% endblock %}
    {% endif %}
</body>
</html>
