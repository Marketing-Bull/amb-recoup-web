{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Settings</h1>
</div>

<div class="card" style="max-width:480px;">
    <div class="form-group" style="margin-bottom:1.5rem;">
        <label class="form-label">Organization</label>
        <input type="text" class="form-input" value="{{ org.name }}" disabled>
    </div>

    <h2 style="font-size:1rem;font-weight:600;margin-bottom:1rem;">Organization Settings</h2>
    <form method="post" action="/settings">
        <div class="form-group">
            <label class="form-label">Mileage Rate ($/mile)</label>
            <input type="number" step="0.01" name="mileage_rate" class="form-input" value="{{ settings.mileage_rate }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
{% endblock %}
