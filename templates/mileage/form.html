{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if entry %}Edit Trip{% else %}Log Trip{% endif %}</h1>
    <a href="/mileage" class="btn btn-secondary">← Back</a>
</div>

{% if not entry and recent_trips %}
<div class="card" style="max-width:640px;margin-bottom:1rem;">
    <label class="form-label" style="margin-bottom:0.5rem;display:block;">Repeat a Recent Trip</label>
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
        {% for t in recent_trips %}
        <button type="button" class="btn btn-secondary recent-trip-chip" style="font-size:0.8rem;"
            data-start="{{ t.start_address or '' }}" data-end="{{ t.end_address or '' }}"
            data-purpose="{{ t.purpose or '' }}" data-miles="{{ t.miles }}"
            data-round-trip="{{ 'true' if t.round_trip else 'false' }}"
            data-client-id="{{ t.client_id or '' }}" data-project-id="{{ t.project_id or '' }}">
            {{ (t.start_address or 'Unnamed trip') ~ (' → ' ~ t.end_address if t.end_address else '') }}
            &middot; {{ t.miles }} mi{% if t.round_trip %} RT{% endif %}
        </button>
        {% endfor %}
    </div>
</div>
{% endif %}

<div class="card" style="max-width:640px;">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="{% if entry %}/mileage/{{ entry.id }}{% else %}/mileage{% endif %}">
        <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-input" value="{{ entry.date[:10] if entry else '' }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Start Address</label>
            <input type="text" name="start_address" class="form-input" value="{{ entry.start_address if entry else '' }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">End Address</label>
            <input type="text" name="end_address" class="form-input" value="{{ entry.end_address if entry else '' }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Purpose</label>
                <input type="text" name="purpose" class="form-input" value="{{ entry.purpose if entry else '' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Miles</label>
                <input type="number" step="0.1" name="miles" class="form-input" value="{{ entry.miles if entry else '' }}" required>
            </div>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
            <input type="checkbox" id="round_trip" name="round_trip" {% if entry and entry.round_trip %}checked{% endif %}>
            <label for="round_trip" style="font-size:0.875rem;margin:0;">Round Trip</label>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
            <input type="checkbox" id="billable" name="billable" {% if not entry or entry.billable %}checked{% endif %}>
            <label for="billable" style="font-size:0.875rem;margin:0;">Billable</label>
        </div>
        <div class="form-group">
            <label class="form-label">Client</label>
            <select name="client_id" id="client_id" class="form-select">
                <option value="" {% if not entry or not entry.client_id %}selected{% endif %}%>None</option>
                {% for c in clients %}
                <option value="{{ c.id }}" {% if entry and entry.client_id == c.id %}selected{% endif %}%>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Project</label>
            <select name="project_id" id="project_id" class="form-select">
                <option value="" {% if not entry or not entry.project_id %}selected{% endif %}%>None</option>
                {% for p in projects %}
                <option value="{{ p.id }}" data-client="{{ p.client_id or '' }}" {% if entry and entry.project_id == p.id %}selected{% endif %}%>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <button type="submit" class="btn btn-primary">{% if entry %}Save Changes{% else %}Log Trip{% endif %}</button>
            <a href="/mileage" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
const clientSelect = document.getElementById('client_id');
const projectSelect = document.getElementById('project_id');
const allProjects = Array.from(projectSelect.options).slice(1);

function filterProjects() {
    const cid = clientSelect.value;
    const current = projectSelect.value;
    projectSelect.innerHTML = '\u003coption value=""\u003eNone\u003c/option\u003e';
    allProjects.forEach(opt => {
        if (!cid || opt.dataset.client === cid || (!opt.dataset.client && !cid)) {
            projectSelect.appendChild(opt.cloneNode(true));
        }
    });
    const stillAvailable = Array.from(projectSelect.options).some(o => o.value === current);
    if (stillAvailable) projectSelect.value = current;
}

clientSelect.addEventListener('change', filterProjects);

document.querySelectorAll('.recent-trip-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelector('input[name="start_address"]').value = chip.dataset.start;
        document.querySelector('input[name="end_address"]').value = chip.dataset.end;
        document.querySelector('input[name="purpose"]').value = chip.dataset.purpose;
        document.querySelector('input[name="miles"]').value = chip.dataset.miles;
        document.getElementById('round_trip').checked = chip.dataset.roundTrip === 'true';
        if (chip.dataset.clientId) {
            clientSelect.value = chip.dataset.clientId;
            filterProjects();
        }
        if (chip.dataset.projectId) {
            projectSelect.value = chip.dataset.projectId;
        }
    });
});
</script>
{% endblock %}
