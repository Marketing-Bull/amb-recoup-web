{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if project %}Edit Project{% else %}New Project{% endif %}</h1>
    <a href="/projects" class="btn btn-secondary">← Back</a>
</div>

<div class="card" style="max-width:640px;">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="{% if project %}/projects/{{ project.id }}{% else %}/projects{% endif %}">
        <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-input" value="{{ project.name if project else '' }}" required autofocus>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Client</label>
                <select name="client_id" class="form-select">
                    <option value="" {% if not project or not project.client_id %}selected{% endif %}%>None</option>
                    {% for c in clients %}
                    <option value="{{ c.id }}" {% if project and project.client_id == c.id %}selected{% endif %}%>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Hourly Rate Override</label>
                <input type="number" step="0.01" name="hourly_rate_override" class="form-input" value="{{ project.hourly_rate_override if project else '' }}" placeholder="0.00">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="active" {% if project and project.status == 'active' %}selected{% endif %}%>Active</option>
                <option value="on_hold" {% if project and project.status == 'on_hold' %}selected{% endif %}%>On Hold</option>
                <option value="completed" {% if project and project.status == 'completed' %}selected{% endif %}%>Completed</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-textarea">{{ project.notes if project else '' }}</textarea>
        </div>
        {% if project %}
        <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
            <input type="checkbox" id="is_archived" name="is_archived" {% if project.is_archived %}checked{% endif %}>
            <label for="is_archived" style="font-size:0.875rem;margin:0;">Archived</label>
        </div>
        {% endif %}
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <button type="submit" class="btn btn-primary">{% if project %}Save Changes{% else %}Create Project{% endif %}</button>
            <a href="/projects" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
