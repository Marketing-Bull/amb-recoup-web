{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if client %}Edit Client{% else %}New Client{% endif %}</h1>
    <a href="/clients" class="btn btn-secondary">← Back</a>
</div>

<div class="card" style="max-width:640px;">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="{% if client %}/clients/{{ client.id }}{% else %}/clients{% endif %}">
        <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-input" value="{{ client.name if client else '' }}" required autofocus>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Hourly Rate</label>
                <input type="number" step="0.01" name="hourly_rate" class="form-input" value="{{ client.hourly_rate if client else '' }}" placeholder="0.00">
            </div>
            <div class="form-group">
                <label class="form-label">Contact Name</label>
                <input type="text" name="contact_name" class="form-input" value="{{ client.contact_name if client else '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Contact Email</label>
                <input type="email" name="contact_email" class="form-input" value="{{ client.contact_email if client else '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Contact Phone</label>
                <input type="tel" name="contact_phone" class="form-input" value="{{ client.contact_phone if client else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-textarea">{{ client.notes if client else '' }}</textarea>
        </div>
        {% if client %}
        <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
            <input type="checkbox" id="is_archived" name="is_archived" {% if client.is_archived %}checked{% endif %}>
            <label for="is_archived" style="font-size:0.875rem;margin:0;">Archived</label>
        </div>
        {% endif %}
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <button type="submit" class="btn btn-primary">{% if client %}Save Changes{% else %}Create Client{% endif %}</button>
            <a href="/clients" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
