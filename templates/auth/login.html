{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-brand">AMB Recoup</div>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="alert alert-success">{{ message }}</div>
        {% endif %}

        <div class="tabs">
            <a href="#" class="tab active" id="tab-password" onclick="switchTab('password')">Password</a>
            <a href="#" class="tab" id="tab-magic" onclick="switchTab('magic')">Magic Link</a>
        </div>

        <form id="form-password" action="/auth/login" method="post" class="form-group">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        </form>

        <form id="form-magic" action="/auth/magic-link" method="post" class="form-group" style="display:none;">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@company.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Send Magic Link</button>
        </form>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--color-border);">
        <p style="text-align: center; font-size: 0.875rem; color: var(--color-text-muted);">
            Don't have an account? <a href="/auth/signup">Sign up</a>
        </p>
    </div>
</div>

<script>
function switchTab(tab) {
    document.getElementById('form-password').style.display = tab === 'password' ? 'block' : 'none';
    document.getElementById('form-magic').style.display = tab === 'magic' ? 'block' : 'none';
    document.getElementById('tab-password').className = tab === 'password' ? 'tab active' : 'tab';
    document.getElementById('tab-magic').className = tab === 'magic' ? 'tab active' : 'tab';
}
</script>
{% endblock %}
