{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-brand">AMB Recoup</div>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/auth/signup" method="post">
            <div class="form-group">
                <label class="form-label">Organization Name</label>
                <input type="text" name="org_name" class="form-input" placeholder="Your Company" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
        </form>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--color-border);">
        <p style="text-align: center; font-size: 0.875rem; color: var(--color-text-muted);">
            Already have an account? <a href="/auth/login">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
